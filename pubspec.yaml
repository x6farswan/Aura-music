name: aura_music
description: Open source YouTube Music client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  kd_youtube_background_audio: ^0.0.8
  audio_service: ^0.18.12
  dio: ^5.4.0
  youtube_explode_dart: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  palette_generator: ^0.3.3+3
  go_router: ^13.0.1
  intl: ^0.19.0
  uuid: ^4.2.1
  crypto: ^3.0.3
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  youtube_explode_dart:
    git:
      url: https://github.com/rsozdance/youtube_explode_dart.git
      ref: master
  flutter_js:
    git:
      url: https://github.com/abner/flutter_js.git
      ref: master
